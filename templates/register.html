{% extends 'base.html' %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Тіркелу</h2>
    <form method="POST">
      <div class="form-group">
        <label>Аты-жөні</label>
        <input type="text" name="name" required placeholder="Аты-жөніңіз">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="email@gmail.com">
      </div>
      <div class="form-group">
        <label>Құпиясөз</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Құпиясөзді растау</label>
        <input type="password" name="confirm_password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary btn-full">Тіркелу</button>
    </form>
    <p class="auth-link">Аккаунт бар ма? <a href="{{ url_for('auth.login') }}">Кіру</a></p>
  </div>
</div>
{% endblock %}
